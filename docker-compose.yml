version: '3.8'
services:
  airflow-init:
    build:
      context: .
      dockerfile: airflowdemo.Dockerfile
    container_name: airflow_init_poc
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    env_file:
      - .env
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Demo --lastname User --role Admin --email demo@example.com || true
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./gcp-service-account.json:/opt/airflow/gcp-service-account.json
      - airflow-db:/opt/airflow/

  airflow-webserver:
    build:
      context: .
      dockerfile: airflowdemo.Dockerfile
    container_name: airflow_webserver_poc
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp-service-account.json
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=10
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./gcp-service-account.json:/opt/airflow/gcp-service-account.json
      - airflow-db:/opt/airflow/
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      - airflow-init

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflowdemo.Dockerfile
    container_name: airflow_scheduler_poc
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp-service-account.json
    env_file:
      - .env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./gcp-service-account.json:/opt/airflow/gcp-service-account.json
      - airflow-db:/opt/airflow/
    command: scheduler
    depends_on:
      - airflow-init

volumes:
  airflow-db:
