version: "3.8"

services:
  airflow:
    image: apache/airflow:2.8.1
    container_name: airflow_poc
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp-service-account.json
    volumes:
      - ./dags:/opt/airflow/dags
      - ./gcp-service-account.json:/opt/airflow/gcp-service-account.json
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Demo --lastname User --role Admin --email demo@example.com &&
      airflow scheduler &
      airflow webserver
      "
